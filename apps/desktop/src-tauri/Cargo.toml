[package]
name = "azkar-app"
version = "1.0.10"
description = "Azkar Desktop App — أذكار الصباح والمساء"
authors = []
edition = "2021"

[lib]
name = "azkar_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
store = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
tauri-plugin-autostart = "2"
tauri-plugin-positioner = "2.3.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Devices_Geolocation", "Foundation"] }

[profile.dev]
incremental = true

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
